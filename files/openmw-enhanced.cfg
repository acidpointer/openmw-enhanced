# OpenMW Enhanced fork-specific settings.
# This file intentionally keeps fork-only options out of upstream settings.cfg.

[Performance]
gpu profile = false
scene profile = false
camera profile = false
renderbin profile = false
drawable profile = false
gpu profile csv =

[Renderer]
disable actors = false
disable objects = false
transparent depth mode = legacy

[Water]
surface = true
reflection = true
refraction = true

[Occlusion]
# Software occlusion culling using a CPU depth buffer (Intel Masked Occlusion Culling).
# Terrain and building meshes are rasterized into a low-res depth buffer during cull traversal.
# Objects whose AABB is fully behind the depth buffer are skipped before draw.
occlusion culling = true

# Rasterize terrain heightmap into the occlusion depth buffer.
occlusion culling terrain = true

# Rasterize simplified building meshes into the occlusion depth buffer.
# Buildings are vertex-clustered into lightweight LODs at load time and cached.
# Works with both paged (ObjectPaging) and unpaged (cell) objects.
occlusion culling statics = true

# Rasterize static objects as occluders. Disable to keep terrain-only occlusion.
occlusion culling static occluders = true

# Test small objects against the enriched occlusion depth buffer.
occlusion culling small objects = true

# Resolution of the software occlusion depth buffer (pixels).
# Higher = more precise occlusion but slower rasterization.
occlusion buffer width = 512
occlusion buffer height = 256

# Terrain LOD level for the occlusion mesh (0=full detail, 6=very coarse).
# Controls vertex stride: LOD 0 = every vertex, LOD 2 = every 4th, LOD 3 = every 8th.
# Higher values reduce terrain rasterization cost at the expense of occlusion accuracy.
occlusion terrain lod = 3

# Radius in cells around the camera to include terrain as occluder.
occlusion terrain radius = 2

# Minimum bounding sphere radius (world units) for a static object to be used as an occluder.
# Objects with radius >= this are vertex-clustered into simplified meshes and rasterized.
# Lower = more occluders (better occlusion, more rasterization cost). 300 catches more mid-sized structures.
occlusion occluder min radius = 300

# Maximum bounding sphere radius (world units) for an unpaged occluder candidate.
# Objects larger than this are skipped as occluders in the cell path (camera is likely inside them).
# Does not affect paged objects, which use min radius only.
occlusion occluder max radius = 5000

# Shrink factor applied to occluder meshes toward their centroid.
# Prevents false occlusion from simplified geometry that slightly exceeds the original shape.
# 1.0 = exact size, <1.0 = smaller.
occlusion occluder shrink factor = 1

# Base grid resolution for vertex clustering of occluder meshes.
# Vertices are snapped to a 3D grid of this resolution per longest axis.
# Higher = more triangles (accurate shape), lower = fewer triangles (faster rasterization).
occlusion occluder mesh resolution = 7

# Maximum grid resolution for adaptive scaling of large occluders.
# Objects larger than min radius get proportionally higher resolution, capped at this value.
# Ensures massive structures preserve openings like tunnels and archways.
occlusion occluder max mesh resolution = 24

# Scale factor for the AABB used to detect if the camera is inside an occluder.
# When inside, the object is not rasterized as an occluder (it would fill the entire buffer).
# 1.0 = exact AABB, >1.0 = larger exclusion zone, <1.0 = smaller.
occlusion occluder inside threshold = 1.0

# Maximum distance (world units) for rasterizing a building as an occluder.
# Beyond this distance, buildings are still tested for visibility but not rasterized.
# Distant buildings are small on screen and unlikely to occlude much.
occlusion occluder max distance = 6144

# Show the software occlusion depth buffer as an overlay in the bottom-left corner.
occlusion debug overlay = false

# Log periodic occlusion culling statistics (triangle counts, occluded objects, etc).
occlusion debug messages = false

# Enable software occlusion culling in interior cells. Default off.
occlusion culling interiors = false

# Maximum number of building occluder triangles to rasterize per frame (0 = unlimited).
# Prevents CPU choke in very dense scenes. Terrain is always rasterized regardless.
occlusion max triangles = 30000

# Maximum static occluder rasterization time per camera pass (0 = unlimited).
occlusion static raster time budget ms = 1.0

# Minimum approximate screen coverage for static occluders.
occlusion min occluder screen ratio = 0.002

# Minimum approximate screen coverage for objects to run an occlusion test.
occlusion min occludee screen ratio = 0.00005

# Temporarily back off static occluders when cost is high and benefit is low.
occlusion adaptive statics = true
occlusion adaptive min benefit ratio = 0.05
occlusion adaptive cooldown frames = 120

# Select which cameras participate in enhanced water occlusion handling.
occlusion water cameras = main

# Allow static occluder rasterization in water reflection/refraction camera passes.
occlusion water static occluders = false

[Shadows]
screen space shadows = true
screen space shadows force postprocess = true
