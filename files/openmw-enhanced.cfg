# OpenMW Enhanced fork-specific settings.
# This file intentionally keeps fork-only options out of upstream settings.cfg.

[Performance]
gpu profile = false
scene profile = false
camera profile = false
renderbin profile = false
drawable profile = false
gpu profile csv =

[Renderer]
disable actors = false
disable objects = false
transparent depth mode = legacy

[Water]
surface = true
reflection = true
refraction = true
occlusion cameras = main

[Shadows]
screen space shadows = true
screen space shadows force postprocess = true
