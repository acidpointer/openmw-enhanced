name = "postprocess-known-source-optimizations"
status = "active"
implementation = "components/fx/shadercompatibility.cpp"
normalization = "Strip UTF-8 BOM and normalize CRLF to LF before matching."
matching = "Exact normalized byte count plus FNV-1a-64 fingerprint; filename alone never selects a patch."
notes = "Transforms VFS-selected source in memory; never edits mod files or changes data-directory priority. Unknown and edited revisions pass through. No complete third-party shader sources are redistributed here."

